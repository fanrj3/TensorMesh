<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">TensorMesh Runtime Architecture</title>
  <desc id="desc">Architecture diagram showing TensorMesh CLI, Web/API services, Slurm GPU control, login isolation, persistent storage, and mail notices.</desc>
  <defs>
    <style>
      .bg { fill: #fafafa; }
      .title { font: 700 32px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111111; }
      .subtitle { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #525252; }
      .group { fill: #ffffff; stroke: #e5e5e5; stroke-width: 1.4; rx: 20; }
      .group-title { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111111; }
      .box { stroke-width: 1.4; rx: 14; }
      .box-title { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111111; }
      .box-text { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #525252; }
      .small { font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #737373; }
      .pill { fill: #111111; rx: 999; }
      .pill-text { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .login { fill: #f8fafc; stroke: #94a3b8; }
      .cli { fill: #eef6ff; stroke: #2f80ed; }
      .web { fill: #f4f0ff; stroke: #7c3aed; }
      .api { fill: #ecfdf5; stroke: #059669; }
      .slurm { fill: #fff1f2; stroke: #e11d48; }
      .data { fill: #fff7ed; stroke: #ea580c; }
      .guard { fill: #f1f5f9; stroke: #475569; }
      .external { fill: #f5f5f5; stroke: #737373; }
      .arrow { stroke: #404040; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .soft-arrow { stroke: #737373; stroke-width: 1.25; fill: none; marker-end: url(#arrow-soft); }
      .deny { stroke: #dc2626; stroke-width: 1.5; fill: none; stroke-dasharray: 5 5; marker-end: url(#arrow-red); }
      .grant { stroke: #059669; stroke-width: 1.5; fill: none; stroke-dasharray: 5 5; marker-end: url(#arrow-green); }
      .label { fill: #ffffff; stroke: #e5e5e5; stroke-width: 1; rx: 8; }
      .label-text { font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #404040; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#404040"/>
    </marker>
    <marker id="arrow-soft" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#737373"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#059669"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="1040"/>
  <text class="title" x="64" y="70">TensorMesh Runtime Architecture</text>
  <text class="subtitle" x="64" y="100">CLI-first GPU governance with Web observability, Slurm cgroup enforcement, persistent telemetry, and user-scoped notifications.</text>

  <rect class="pill" x="64" y="130" width="122" height="32"/>
  <text class="pill-text" x="86" y="151">Current node</text>
  <text class="small" x="204" y="151">Ubuntu 20.04 hybrid cgroup v1 · shared login user.slice · Slurm job cgroups for GPU and memory</text>

  <!-- User and login layer -->
  <rect class="group" x="64" y="200" width="410" height="505"/>
  <text class="group-title" x="94" y="238">User Entry</text>

  <rect class="box login" x="104" y="270" width="160" height="72"/>
  <text class="box-title" x="128" y="298">Research User</text>
  <text class="box-text" x="128" y="320">Linux / SSH account</text>

  <rect class="box guard" x="104" y="386" width="320" height="92"/>
  <text class="box-title" x="128" y="416">Ordinary Login Shell</text>
  <text class="box-text" x="128" y="438">Direct GPU access denied</text>
  <text class="box-text" x="128" y="460">CFS quota: shared 4 CPU cores</text>

  <rect class="box cli" x="104" y="522" width="320" height="92"/>
  <text class="box-title" x="128" y="552">tmesh CLI / TUI</text>
  <text class="box-text" x="128" y="574">status · run · bash · reserve · cancel</text>
  <text class="box-text" x="128" y="596">notice · web · curses dashboard</text>

  <rect class="box cli" x="104" y="642" width="142" height="46"/>
  <text class="box-title" x="128" y="670">Local Notice</text>

  <rect class="box web" x="282" y="642" width="142" height="46"/>
  <text class="box-title" x="306" y="670">Web Token</text>

  <!-- Login isolation -->
  <rect class="group" x="64" y="742" width="410" height="210"/>
  <text class="group-title" x="94" y="780">Login Isolation</text>

  <rect class="box guard" x="104" y="812" width="150" height="70"/>
  <text class="box-title" x="128" y="840">PAM Hook</text>
  <text class="box-text" x="128" y="862">open_session</text>

  <rect class="box guard" x="290" y="812" width="144" height="70"/>
  <text class="box-title" x="312" y="840">user.slice</text>
  <text class="box-text" x="312" y="862">GPU deny + CPU quota</text>

  <text class="small" x="104" y="918">top / htop still show all CPUs; CFS quota throttles total runtime.</text>

  <!-- TensorMesh services -->
  <rect class="group" x="555" y="200" width="490" height="505"/>
  <text class="group-title" x="585" y="238">TensorMesh Services</text>

  <rect class="box web" x="595" y="270" width="180" height="78"/>
  <text class="box-title" x="620" y="302">Web Service</text>
  <text class="box-text" x="620" y="324">Vite / React</text>
  <text class="box-text" x="620" y="342">LAN port 8000</text>

  <rect class="box web" x="825" y="270" width="180" height="78"/>
  <text class="box-title" x="850" y="302">Browser Portal</text>
  <text class="box-text" x="850" y="324">/tokens URL</text>
  <text class="box-text" x="850" y="342">status · history · export</text>

  <rect class="box api" x="670" y="420" width="220" height="100"/>
  <text class="box-title" x="710" y="452">TensorMesh API</text>
  <text class="box-text" x="710" y="474">Node / TypeScript</text>
  <text class="box-text" x="710" y="496">port 4317 · token auth</text>

  <rect class="box api" x="595" y="575" width="170" height="78"/>
  <text class="box-title" x="620" y="607">Collector Loop</text>
  <text class="box-text" x="620" y="629">10s raw samples</text>
  <text class="box-text" x="620" y="647">GPU / CPU telemetry</text>

  <rect class="box api" x="825" y="575" width="180" height="78"/>
  <text class="box-title" x="850" y="607">Notice Worker</text>
  <text class="box-text" x="850" y="629">finish · start · overdue</text>
  <text class="box-text" x="850" y="647">low utilization</text>

  <!-- Slurm and GPU -->
  <rect class="group" x="1125" y="200" width="410" height="505"/>
  <text class="group-title" x="1155" y="238">Slurm and GPU Control</text>

  <rect class="box slurm" x="1170" y="270" width="320" height="76"/>
  <text class="box-title" x="1205" y="302">slurmctld + slurmd</text>
  <text class="box-text" x="1205" y="324">MUNGE auth · single-node partition</text>

  <rect class="box slurm" x="1170" y="386" width="320" height="76"/>
  <text class="box-title" x="1205" y="418">Typed GRES</text>
  <text class="box-text" x="1205" y="440">gpu0 ... gpu7 map to physical cards</text>

  <rect class="box slurm" x="1170" y="502" width="320" height="84"/>
  <text class="box-title" x="1205" y="532">Slurm Job Cgroup</text>
  <text class="box-text" x="1205" y="554">ConstrainDevices · ConstrainCores</text>
  <text class="box-text" x="1205" y="574">ConstrainRAMSpace · ConstrainSwapSpace</text>

  <rect class="box slurm" x="1170" y="626" width="150" height="60"/>
  <text class="box-title" x="1190" y="654">Training Job</text>
  <text class="box-text" x="1190" y="674">run or bash</text>

  <rect class="box slurm" x="1340" y="626" width="150" height="60"/>
  <text class="box-title" x="1362" y="654">GPU Node</text>
  <text class="box-text" x="1362" y="674">NVIDIA GPUs</text>

  <!-- Storage and external services -->
  <rect class="group" x="555" y="742" width="980" height="210"/>
  <text class="group-title" x="585" y="780">Storage, Secrets, and External Integrations</text>

  <rect class="box data" x="595" y="812" width="180" height="74"/>
  <text class="box-title" x="620" y="842">SQLite</text>
  <text class="box-text" x="620" y="864">history · jobs · users</text>

  <rect class="box data" x="815" y="812" width="180" height="74"/>
  <text class="box-title" x="840" y="842">Job Logs</text>
  <text class="box-text" x="840" y="864">.tmesh/{job}/run.log</text>

  <rect class="box data" x="1035" y="812" width="180" height="74"/>
  <text class="box-title" x="1060" y="842">Token Secrets</text>
  <text class="box-text" x="1060" y="864">per-user web tokens</text>

  <rect class="box data" x="1255" y="812" width="120" height="74"/>
  <text class="box-title" x="1276" y="842">Mail JWT</text>
  <text class="box-text" x="1276" y="864">root-only</text>

  <rect class="box external" x="1400" y="812" width="95" height="74"/>
  <text class="box-title" x="1418" y="842">CloudMail</text>
  <text class="box-text" x="1418" y="864">send_mail</text>

  <!-- Arrows -->
  <path class="arrow" d="M184 342 L184 386"/>
  <path class="arrow" d="M264 478 L264 522"/>
  <path class="arrow" d="M218 614 L190 642"/>
  <path class="arrow" d="M326 614 L340 642"/>
  <path class="arrow" d="M254 847 L290 847"/>
  <path class="deny" d="M362 812 C390 760 395 705 386 660"/>

  <path class="arrow" d="M424 568 C500 560 560 520 670 482"/>
  <rect class="label" x="475" y="520" width="86" height="24"/>
  <text class="label-text" x="488" y="536">API status</text>

  <path class="arrow" d="M424 665 C560 665 650 535 670 490"/>
  <rect class="label" x="488" y="638" width="132" height="24"/>
  <text class="label-text" x="502" y="654">local notice API</text>

  <path class="arrow" d="M424 665 C585 640 740 320 825 310"/>
  <rect class="label" x="473" y="606" width="120" height="24"/>
  <text class="label-text" x="488" y="622">signed web URL</text>

  <path class="arrow" d="M775 310 L825 310"/>
  <path class="arrow" d="M915 348 L825 420"/>
  <rect class="label" x="842" y="374" width="88" height="24"/>
  <text class="label-text" x="854" y="390">token HTTP</text>

  <path class="arrow" d="M780 520 L680 575"/>
  <path class="arrow" d="M790 520 L912 575"/>

  <path class="arrow" d="M890 458 C1015 420 1065 310 1170 308"/>
  <rect class="label" x="1000" y="358" width="96" height="24"/>
  <text class="label-text" x="1012" y="374">squeue API</text>

  <path class="arrow" d="M424 568 C780 530 920 290 1170 306"/>
  <rect class="label" x="680" y="350" width="168" height="24"/>
  <text class="label-text" x="694" y="366">sbatch / srun / scancel</text>

  <path class="arrow" d="M1330 346 L1330 386"/>
  <path class="arrow" d="M1330 462 L1330 502"/>
  <path class="arrow" d="M1245 586 L1245 626"/>
  <path class="arrow" d="M1320 656 L1340 656"/>
  <path class="grant" d="M1330 586 C1305 610 1280 620 1260 626"/>

  <path class="soft-arrow" d="M780 520 C780 690 685 750 685 812"/>
  <path class="soft-arrow" d="M680 653 L680 812"/>
  <path class="soft-arrow" d="M780 520 C835 660 890 720 905 812"/>
  <path class="soft-arrow" d="M780 520 C900 660 1070 720 1125 812"/>
  <path class="soft-arrow" d="M915 653 C970 720 1160 760 1315 812"/>
  <path class="arrow" d="M1375 849 L1400 849"/>

  <path class="soft-arrow" d="M1245 686 C1160 760 1015 790 995 836"/>
  <path class="soft-arrow" d="M890 470 C1065 470 1275 660 1415 626"/>
  <rect class="label" x="1066" y="446" width="154" height="24"/>
  <text class="label-text" x="1078" y="462">nvidia-smi telemetry</text>
</svg>
